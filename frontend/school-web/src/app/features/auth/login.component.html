<div class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <img src="logo.svg" alt="EduNestIO" height="40" class="login__logo" />
    <h1>Sign in</h1>
    <p class="login__subtitle">School Management SaaS</p>

    <label class="field">
      <span class="field__label">Username</span>
      <input type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="field__error">Username is required.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Password is required.</span>
      }
    </label>

    <button type="submit" class="btn btn--primary" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
