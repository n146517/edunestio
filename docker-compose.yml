# EduNestIO — local development compose.
# Brings up PostgreSQL and auto-applies the /database scripts on first run.
# Secrets are passed via environment (see .env.example); do not commit real values.
services:
  db:
    image: postgres:16
    container_name: edunestio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: edunestio
    ports:
      - "5432:5432"
    volumes:
      - edunestio_pgdata:/var/lib/postgresql/data
      # Scripts in this folder run in alphabetical order on first init.
      # 00_create_database.sql is skipped here (POSTGRES_DB already creates it);
      # the numbered scripts 01..07 initialize schema/functions/seed.
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/03_functions.sql:/docker-entrypoint-initdb.d/03_functions.sql:ro
      - ./database/04_procedures.sql:/docker-entrypoint-initdb.d/04_procedures.sql:ro
      - ./database/05_views.sql:/docker-entrypoint-initdb.d/05_views.sql:ro
      - ./database/06_seed_reference_data.sql:/docker-entrypoint-initdb.d/06_seed_reference_data.sql:ro
      - ./database/07_test_data.sql:/docker-entrypoint-initdb.d/07_test_data.sql:ro
      # Module migrations (applied after base scripts, alphabetical).
      - ./database/modules/10_academic_setup.sql:/docker-entrypoint-initdb.d/10_academic_setup.sql:ro
      - ./database/modules/11_admissions.sql:/docker-entrypoint-initdb.d/11_admissions.sql:ro
      - ./database/modules/12_attendance.sql:/docker-entrypoint-initdb.d/12_attendance.sql:ro
      - ./database/modules/13_fees.sql:/docker-entrypoint-initdb.d/13_fees.sql:ro
      - ./database/modules/14_exams.sql:/docker-entrypoint-initdb.d/14_exams.sql:ro
      - ./database/modules/16_students_enhance.sql:/docker-entrypoint-initdb.d/16_students_enhance.sql:ro
      - ./database/modules/17_student_enrollment.sql:/docker-entrypoint-initdb.d/17_student_enrollment.sql:ro
      - ./database/modules/18_exams_upgrade.sql:/docker-entrypoint-initdb.d/18_exams_upgrade.sql:ro
      - ./database/modules/19_exam_subjects_schedule.sql:/docker-entrypoint-initdb.d/19_exam_subjects_schedule.sql:ro
      - ./database/modules/20_exam_marks_upgrade.sql:/docker-entrypoint-initdb.d/20_exam_marks_upgrade.sql:ro
      - ./database/modules/21_exam_results.sql:/docker-entrypoint-initdb.d/21_exam_results.sql:ro
      - ./database/modules/22_report_cards.sql:/docker-entrypoint-initdb.d/22_report_cards.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d edunestio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edunestio_pgdata:
